<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Travel Explorer</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      background: #fbfaf6;
      color: #182b27;
      font-family: Arial, Helvetica, sans-serif;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
      background: #fbfaf6;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 42px;
      background: #fff;
      border: 1px solid #e1e7dd;
      border-radius: 6px;
      box-shadow: 0 10px 35px rgba(24, 43, 39, 0.07);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 30px;
      color: #102c27;
      font-size: 23px;
      font-weight: 800;
    }

    .login-logo span {
      color: #648d6b;
    }

    .login-card .eyebrow {
      text-align: center;
      color: #648d6b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      margin-bottom: 12px;
    }

    .login-card h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 10px;
    }

    .login-subtitle {
      text-align: center;
      color: #69766f;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .login-card label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    .login-card input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d9e0d7;
      border-radius: 4px;
      background: white;
      color: #182b27;
      font: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }

    .login-card input:focus {
      outline: 2px solid #8eae91;
      outline-offset: 1px;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 4px;
      background: #102c27;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
      background: #244b3c;
      transform: translateY(-2px);
    }

    .login-message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      color: #b42318;
    }

    .register-link {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e9e9df;
      text-align: center;
      color: #69766f;
      font-size: 13px;
    }

    .register-link a {
      color: #466e50;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 22px;
      }

      .login-card h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <div class="login-logo">✈ Travel<span>Explorer</span></div>

      <p class="eyebrow">YOUR NEXT JOURNEY</p>
      <h1>Welcome Back</h1>
      <p class="login-subtitle">
        Sign in to continue exploring the world.
      </p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button class="login-button" type="submit">Sign In</button>

        <p class="login-message" id="loginMessage" role="status"></p>
      </form>

      <p class="register-link">
        New to Travel Explorer?
        <a href="register.html">Create an account</a>
      </p>
    </section>
  </main>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email")
          .value.trim().toLowerCase();

        const password = document.getElementById("password").value;
        const message = document.getElementById("loginMessage");

        let accounts;

        try {
          accounts = JSON.parse(
            localStorage.getItem("travelExplorerAccounts") || "[]"
          );
        } catch (error) {
          message.textContent =
            "Unable to read registered accounts. Please try again.";
          return;
        }

        if (!Array.isArray(accounts)) {
          accounts = [];
        }

        const account = accounts.find(function(user) {
          return user.email === email && user.password === password;
        });

        if (!account) {
          message.textContent =
            "Invalid email or password. Please register first.";
          return;
        }

        localStorage.setItem(
          "travelExplorerLoggedIn",
          JSON.stringify({
            name: account.name,
            email: account.email
          })
        );

        window.location.href = "index.html";
      });
  </script>
</body>
</html>
